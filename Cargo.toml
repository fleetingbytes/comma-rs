[workspace]

members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
authors = ["Sven Siegmund <sven.siegmund@gmail.com>", "SpaceXAI"]
description = "Command line apps for Comma devices"
repository = "https://github.com/fleetingbytes/comma-rs"
homepage = "https://crates.io/comma-cli/latest/comma-cli"
documentation = "https://docs.rs/comma-cli/latest/comma-cli"
license = "BSD-2-Clause"
keywords = ["tools", "comma", "commaai", "openpilot"]
categories = ["command-line-utilities"]

[workspace.dependencies]
comma-connect-api = { path = "crates/comma-connect-api", version = "0.1.0" }

[workspace.lints.rust]

[workspace.lints.clippy]
