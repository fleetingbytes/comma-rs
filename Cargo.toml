[workspace]

members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
authors = ["fleetingbytes <7075397+fleetingbytes@users.noreply.github.com>", "SpaceXAI"]
description = "Command line apps for Comma devices"
repository = "https://github.com/fleetingbytes/comma-rs"
homepage = "https://crates.io/crates/comma-cli"
documentation = "https://docs.rs/comma-cli"
license = "BSD-2-Clause"
keywords = ["tools", "comma", "commaai", "openpilot"]
categories = ["command-line-utilities"]

[workspace.dependencies]
comma-connect-api = { path = "crates/comma-connect-api", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
confy = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
cucumber = "0.21"
comma-test-utils = { path = "crates/comma-test-utils", version = "0.1.0" }

[workspace.lints.rust]

[workspace.lints.clippy]
